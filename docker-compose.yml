# Hikidashi on one host: the server, the two workers that run the pipeline on
# new reels, and (with --profile ai) Ollama. One SQLite file, no orchestration.
#
# Two images (#86). The server image has the web stack, yt-dlp and the
# embedder; the worker image has Whisper and tesseract. Both are published
# (#77): `docker compose up -d` pulls them, and builds from this checkout only
# when there is nothing to pull, or with --build. HIKIDASHI_VERSION picks the
# release (latest unless set, as 1.2.3); a tag nobody published, as `dev`,
# keeps your own builds. Each tag is built by one service, as two services
# building one tag at once collide (#79).
#
#   app            server image   the web UI and API, import, places
#   server-worker  server image   enrich and embed, on new reels
#   worker         worker image   asr, ocr, tag and recipe, on new reels
#   ollama         ollama/ollama  the models tag and recipe call (--ai)

# What every Hikidashi container shares: restarts, the user, and the data.
x-hikidashi: &hikidashi
  restart: unless-stopped
  # The user the containers write /data as: root unless set, or a NAS's own,
  # as HIKIDASHI_USER=99:100 on Unraid or 568:568 on TrueNAS. All of them on
  # one library run as the same user (docs/adr/0012).
  user: ${HIKIDASHI_USER:-0:0}
  volumes:
    # HIKIDASHI_DATA: the database, media and models. Keep it on local block
    # storage. SQLite over NFS or SMB is a corruption path, and so is a FUSE
    # share like Unraid's /mnt/user: use a pool, as /mnt/cache/appdata/hikidashi.
    - ${HIKIDASHI_DATA:-./data}:/data

# Hosted AI (#116, #125; docs/operation.md#hosted-ai): the server's API, for
# the app (its settings page) and the server-worker (which runs the switched-on
# APIs). All optional: set it up on Account → AI providers or with
# `hikidashi ai` instead. Env never turns it on. Both read the same
# HIKIDASHI_SECRET_KEY, or /data/secret.key.
x-hosted-ai: &hosted-ai
  HIKIDASHI_ASR_PROVIDER: ${HIKIDASHI_ASR_PROVIDER:-}
  HIKIDASHI_ASR_MODEL: ${HIKIDASHI_ASR_MODEL:-}
  HIKIDASHI_OCR_PROVIDER: ${HIKIDASHI_OCR_PROVIDER:-}
  HIKIDASHI_OCR_MODEL: ${HIKIDASHI_OCR_MODEL:-}
  HIKIDASHI_LLM_PROVIDER: ${HIKIDASHI_LLM_PROVIDER:-}
  HIKIDASHI_LLM_MODEL: ${HIKIDASHI_LLM_MODEL:-}
  HIKIDASHI_ASR_LANGUAGE: ${HIKIDASHI_ASR_LANGUAGE:-}
  HIKIDASHI_OPENAI_BASE_URL: ${HIKIDASHI_OPENAI_BASE_URL:-}
  HIKIDASHI_OPENAI_API_KEY: ${HIKIDASHI_OPENAI_API_KEY:-}
  HIKIDASHI_HOSTED_BUDGET: ${HIKIDASHI_HOSTED_BUDGET:-}
  HIKIDASHI_SECRET_KEY: ${HIKIDASHI_SECRET_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

# A worker on new reels: its name, its share of the CPU, its models.
x-worker: &worker
  <<: *hikidashi
  command: ["hikidashi", "worker"]
  # Cores it may use, so a small always-on box stays responsive. Raise it on
  # a desktop with cores to spare; 0 lifts the limit.
  cpus: ${HIKIDASHI_WORKER_CPUS:-2}
  # Time to give back the reels in hand before Docker kills it.
  stop_grace_period: 30s

services:
  app:
    <<: *hikidashi
    image: ghcr.io/spanthetree/hikidashi-server:${HIKIDASHI_VERSION:-latest}
    container_name: hikidashi
    build:
      context: .
      target: server
    environment:
      <<: *hosted-ai
      # Accounts: none (everyone is the owner), local or proxy. See the README.
      HIKIDASHI_AUTH: ${HIKIDASHI_AUTH:-none}
      HIKIDASHI_ORIGIN: ${HIKIDASHI_ORIGIN:-}
      HIKIDASHI_PROXY_HEADER: ${HIKIDASHI_PROXY_HEADER:-Remote-User}
      HIKIDASHI_TRUSTED_PROXIES: ${HIKIDASHI_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      HIKIDASHI_PROXY_CREATES: ${HIKIDASHI_PROXY_CREATES:-}
      # Maps: where places are looked up (off when empty), and the tiles drawn.
      HIKIDASHI_GEOCODER: ${HIKIDASHI_GEOCODER:-}
      HIKIDASHI_GEOCODER_DELAY: ${HIKIDASHI_GEOCODER_DELAY:-1}
      HIKIDASHI_LOCATE_EVERY: ${HIKIDASHI_LOCATE_EVERY:-300}
      HIKIDASHI_TILES: ${HIKIDASHI_TILES:-}
      HIKIDASHI_TILES_ATTRIBUTION: ${HIKIDASHI_TILES_ATTRIBUTION:-}
      # Ask your library goes to the Ollama the worker uses, unless the
      # person has a hosted API or an Ollama of their own under AI providers. And the rest of an incomplete recipe is fetched from the page
      # its caption links to; off to never fetch (docs/adr/0020).
      OLLAMA_URL: ${HIKIDASHI_OLLAMA_URL:-http://ollama:11434}
      HIKIDASHI_RECIPE_FETCH: ${HIKIDASHI_RECIPE_FETCH:-on}
    # A Nominatim on the Docker host, for HIKIDASHI_GEOCODER: Docker Desktop
    # has host.docker.internal on its own, Linux only with this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # HIKIDASHI_HOST / HIKIDASHI_PORT, as for ./hikidashi in uv mode.
      - "${HIKIDASHI_HOST:-0.0.0.0}:${HIKIDASHI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/auth')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Stages run by hand: ./hikidashi runs import, enrich, embed and places in
    # here, and transcribe, ocr, tag and recipe in the worker.

  # Enrich and embed on new reels: `hikidashi worker` in the server image.
  # Apart from the app, so a yt-dlp hang or a backlog of embeddings never
  # takes the web UI down, and it restarts and logs on its own.
  server-worker:
    <<: *worker
    # The app's image, which the app builds when it builds.
    image: ghcr.io/spanthetree/hikidashi-server:${HIKIDASHI_VERSION:-latest}
    container_name: hikidashi-server-worker
    # Its own log file: the worker container writes worker.log in the same
    # folder, and two writers rotating one file lose lines.
    command: ["hikidashi", "worker", "--log", "server-worker.log"]
    # Its name in `./hikidashi status`.
    hostname: ${HIKIDASHI_SERVER_WORKER_NAME:-hikidashi-server-worker}
    environment:
      <<: *hosted-ai
      # Of enrich and embed. The other stages need the worker image.
      HIKIDASHI_LOCAL_STAGES: ${HIKIDASHI_SERVER_STAGES:-enrich,embed}
      HIKIDASHI_UNLOAD_AFTER: ${HIKIDASHI_UNLOAD_AFTER:-300}

  # ASR, OCR, tagging and recipes on new reels. Apart from the server, so
  # Whisper and Ollama never compete with page loads, and a crash
  # mid-transcription never takes the web UI down with it.
  worker:
    <<: *worker
    # hikidashi-worker-cuda on a GPU host, and uncomment the deploy block below.
    image: ghcr.io/spanthetree/${HIKIDASHI_WORKER_IMAGE:-hikidashi-worker}:${HIKIDASHI_VERSION:-latest}
    container_name: hikidashi-worker
    build:
      context: .
      target: worker
      args:
        # Building it: "--extra cuda" for the cuda image.
        EXTRAS: ${HIKIDASHI_EXTRAS:-}
    # Its name in `./hikidashi status`; give each worker on a database its own.
    hostname: ${HIKIDASHI_WORKER_NAME:-hikidashi-worker}
    environment:
      HIKIDASHI_PROFILE: ${HIKIDASHI_PROFILE:-auto}
      # Of asr, ocr, tag and recipe. On a box that leaves tagging to a GPU
      # desktop's worker: asr,ocr.
      HIKIDASHI_LOCAL_STAGES: ${HIKIDASHI_LOCAL_STAGES:-asr,ocr,tag,recipe}
      HIKIDASHI_UNLOAD_AFTER: ${HIKIDASHI_UNLOAD_AFTER:-300}
      # The Ollama that tag and recipe call: the bundled one (--ai) unless set.
      # Its own name, so .env's OLLAMA_URL (for uv, often localhost) is never
      # read: in a container, localhost is the container itself.
      OLLAMA_URL: ${HIKIDASHI_OLLAMA_URL:-http://ollama:11434}
    # For HIKIDASHI_PROFILE=cuda (or auto on a GPU host), pass the card through:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # The tagger and the recipe pass. Start it with:  ./hikidashi start --ai
  ollama:
    image: ollama/ollama:latest
    container_name: hikidashi-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    # Ollama finds a GPU on its own; this block is all that enabling one takes.
    # Uncomment once the VM has a card passed through via DirectPath I/O.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
