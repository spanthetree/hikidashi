<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="A terminal on the desktop running hikidashi worker with --server: it starts, claims batches of reels from the server for asr, ocr, tag and recipe, logs each batch as it finishes, and exits when there is nothing left to do.">
<title>A terminal on the desktop running hikidashi worker with --server: it starts, claims batches of reels from the server for asr, ocr, tag and recipe, logs each batch as it finishes, and exits when there is nothing left to do.</title>
