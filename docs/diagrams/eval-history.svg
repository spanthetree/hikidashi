<circle class="blended dot" cx="64.0" cy="31.8" r="3.5"/>
<circle class="blended dot" cx="229.3" cy="31.8" r="3.5"/>
<circle class="blended dot" cx="394.7" cy="31.8" r="3.5"/>
<circle class="blended dot" cx="560.0" cy="31.8" r="3.5"/>
