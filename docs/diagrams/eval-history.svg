<text class="c e" x="56" y="181.2">0.6</text>
<path class="grid" d="M64,140.4L600,140.4"/>
<text class="c e" x="56" y="144.4">0.7</text>
<path class="grid" d="M64,103.6L600,103.6"/>
<text class="c e" x="56" y="107.6">0.8</text>
<path class="grid" d="M64,66.8L600,66.8"/>
<text class="c e" x="56" y="70.8">0.9</text>
<path class="grid" d="M64,30L600,30"/>
<text class="c e" x="56" y="34">1.0</text>
</svg>
