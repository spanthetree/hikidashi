<circle class="keyword dot" cx="560.0" cy="122.4" r="3.5"/>
<text class="s" x="574" y="100">search, keywords only</text>
<text class="l keywordt" x="574" y="116">0.749</text>
<polyline class="tagging sl" points="64.0,59.1 229.3,58.3 394.7,58.3 560.0,58.3"/>
